<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>ESP32 Weather Station</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-top: #101c30;
    --bg-bottom: #0a141f;
    --card: #16233a;
    --card-border: #223252;
    --text-primary: #f2efe8;
    --text-secondary: #9aa7c2;
    --text-muted: #647394;
    --coral: #e8734a;
    --coral-dim: #4a3226;
    --teal: #3fa79c;
    --teal-dim: #1f3a37;
    --danger: #d9503f;
    --radius: 18px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', sans-serif;
    background: linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
    min-height: 100vh;
    color: var(--text-primary);
    padding: 20px 16px 40px;
    transition: background 1.2s ease;
  }

  .wrap { max-width: 440px; margin: 0 auto; }

  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 22px;
  }

  .title-block h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 20px;
    font-weight: 500;
    letter-spacing: 0.2px;
  }

  .title-block p {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 2px;
  }

  .status-pill {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: var(--text-secondary);
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--card-border);
    padding: 6px 10px;
    border-radius: 999px;
  }

  .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--teal);
    box-shadow: 0 0 0 0 rgba(63,167,156,0.6);
    animation: pulse 2s infinite;
  }

  .dot.offline { background: var(--danger); animation: none; }

  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(63,167,156,0.5); }
    70% { box-shadow: 0 0 0 6px rgba(63,167,156,0); }
    100% { box-shadow: 0 0 0 0 rgba(63,167,156,0); }
  }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 12px;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: var(--radius);
    padding: 18px 16px;
    position: relative;
    overflow: hidden;
  }

  .card .label {
    font-size: 12px;
    color: var(--text-secondary);
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 10px;
  }

  .card .icon {
    width: 16px;
    height: 16px;
    flex-shrink: 0;
  }

  .card .value {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 42px;
    font-weight: 500;
    line-height: 1;
    display: flex;
    align-items: baseline;
    gap: 3px;
  }

  .card .value .unit {
    font-size: 17px;
    font-weight: 400;
    color: var(--text-secondary);
  }

  .card.temp .value { color: var(--coral); }
  .card.hum .value { color: var(--teal); }

  .card .range {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 8px;
  }

  .card .spark {
    width: 100%;
    height: 44px;
    margin-top: 10px;
    display: block;
  }

  .feed-card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: var(--radius);
    padding: 16px 18px;
    margin-top: 12px;
  }

  .feed-card h2 {
    font-size: 13px;
    font-weight: 500;
    color: var(--text-secondary);
    margin-bottom: 12px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .feed-row {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    padding: 7px 0;
    border-bottom: 1px solid var(--card-border);
  }

  .feed-row:last-child { border-bottom: none; }

  .feed-row .t { color: var(--text-muted); }
  .feed-row .v { color: var(--text-primary); font-variant-numeric: tabular-nums; }

  footer {
    text-align: center;
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 20px;
  }

  .error-banner {
    background: var(--coral-dim);
    border: 1px solid var(--danger);
    color: #f4c9be;
    font-size: 12px;
    padding: 10px 14px;
    border-radius: 12px;
    margin-bottom: 14px;
    display: none;
  }

  .error-banner.show { display: block; }

  .skeleton {
    opacity: 0.35;
    filter: blur(1px);
  }
</style>
</head>
<body id="body">
<div class="wrap">
  <header>
    <div class="title-block">
      <h1>Weather station</h1>
      <p>ESP32 &middot; DHT11 sensor</p>
    </div>
    <div class="status-pill">
      <span class="dot" id="statusDot"></span>
      <span id="statusText">Connecting</span>
    </div>
  </header>

  <div class="error-banner" id="errorBanner"></div>

  <div class="grid">
    <div class="card temp" id="tempCard">
      <div class="label">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 14.76V3.5a2.5 2.5 0 0 0-5 0v11.26a4.5 4.5 0 1 0 5 0Z"/></svg>
        Temperature
      </div>
      <div class="value"><span id="tempValue">--</span><span class="unit">&deg;C</span></div>
      <div class="range" id="tempRange">Waiting for data&hellip;</div>
      <canvas class="spark" id="tempSpark"></canvas>
    </div>

    <div class="card hum" id="humCard">
      <div class="label">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.69s-5.5 6.16-5.5 10.19a5.5 5.5 0 0 0 11 0C17.5 8.85 12 2.69 12 2.69Z"/></svg>
        Humidity
      </div>
      <div class="value"><span id="humValue">--</span><span class="unit">%</span></div>
      <div class="range" id="humRange">Waiting for data&hellip;</div>
      <canvas class="spark" id="humSpark"></canvas>
    </div>
  </div>

  <div class="feed-card">
    <h2>Recent readings</h2>
    <div id="feedList">
      <div class="feed-row"><span class="t">Loading&hellip;</span><span class="v"></span></div>
    </div>
  </div>

  <footer>Updates every 20s &middot; ThingSpeak channel 3455165</footer>
</div>

<script>
  const CHANNEL_ID = '3455165';
  const READ_API_KEY = 'B8LSU2CCSXKCN82P';
  const FEED_URL = `https://api.thingspeak.com/channels/${CHANNEL_ID}/feeds.json?api_key=${READ_API_KEY}&results=30`;
  const POLL_MS = 20000;

  const el = {
    tempValue: document.getElementById('tempValue'),
    humValue: document.getElementById('humValue'),
    tempRange: document.getElementById('tempRange'),
    humRange: document.getElementById('humRange'),
    statusDot: document.getElementById('statusDot'),
    statusText: document.getElementById('statusText'),
    errorBanner: document.getElementById('errorBanner'),
    feedList: document.getElementById('feedList'),
    tempCard: document.getElementById('tempCard'),
    humCard: document.getElementById('humCard'),
    body: document.getElementById('body')
  };

  function setBackground(temp) {
    if (temp === null || isNaN(temp)) return;
    const cold = [16, 28, 48];
    const hot = [42, 22, 20];
    const t = Math.max(0, Math.min(1, (temp - 15) / 20));
    const mix = cold.map((c, i) => Math.round(c + (hot[i] - c) * t));
    el.body.style.background = `linear-gradient(180deg, rgb(${mix[0]},${mix[1]},${mix[2]}), #0a141f)`;
  }

  function drawSpark(canvas, values, color) {
    if (!values.length) return;
    const dpr = window.devicePixelRatio || 1;
    const w = canvas.clientWidth, h = canvas.clientHeight;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    const ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);
    ctx.clearRect(0, 0, w, h);

    const min = Math.min(...values);
    const max = Math.max(...values);
    const range = max - min || 1;
    const pad = 4;

    ctx.beginPath();
    values.forEach((v, i) => {
      const x = (i / (values.length - 1)) * (w - pad * 2) + pad;
      const y = h - pad - ((v - min) / range) * (h - pad * 2);
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    });
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.stroke();

    const lastX = w - pad;
    const lastY = h - pad - ((values[values.length - 1] - min) / range) * (h - pad * 2);
    ctx.beginPath();
    ctx.arc(lastX, lastY, 3, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();
  }

  function fmtTime(iso) {
    const d = new Date(iso);
    return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  async function fetchData() {
    try {
      const res = await fetch(FEED_URL);
      if (!res.ok) throw new Error('Request failed: ' + res.status);
      const json = await res.json();
      const feeds = (json.feeds || []).filter(f => f.field1 !== null && f.field2 !== null);

      if (!feeds.length) {
        setStatus(false, 'No data yet');
        return;
      }

      const temps = feeds.map(f => parseFloat(f.field1)).filter(v => !isNaN(v));
      const hums = feeds.map(f => parseFloat(f.field2)).filter(v => !isNaN(v));

      const latestTemp = temps[temps.length - 1];
      const latestHum = hums[hums.length - 1];

      el.tempValue.textContent = latestTemp.toFixed(1);
      el.humValue.textContent = latestHum.toFixed(1);

      el.tempRange.textContent = `${Math.min(...temps).toFixed(1)}\u2013${Math.max(...temps).toFixed(1)}\u00b0C range`;
      el.humRange.textContent = `${Math.min(...hums).toFixed(1)}\u2013${Math.max(...hums).toFixed(1)}% range`;

      drawSpark(document.getElementById('tempSpark'), temps.slice(-20), '#e8734a');
      drawSpark(document.getElementById('humSpark'), hums.slice(-20), '#3fa79c');

      setBackground(latestTemp);

      const recent = feeds.slice(-6).reverse();
      el.feedList.innerHTML = recent.map(f => `
        <div class="feed-row">
          <span class="t">${fmtTime(f.created_at)}</span>
          <span class="v">${parseFloat(f.field1).toFixed(1)}&deg;C &middot; ${parseFloat(f.field2).toFixed(1)}%</span>
        </div>
      `).join('');

      setStatus(true, 'Live');
      el.errorBanner.classList.remove('show');
    } catch (err) {
      setStatus(false, 'Offline');
      el.errorBanner.textContent = 'Could not reach ThingSpeak. Check your connection or API key.';
      el.errorBanner.classList.add('show');
    }
  }

  function setStatus(online, text) {
    el.statusDot.classList.toggle('offline', !online);
    el.statusText.textContent = text;
  }

  fetchData();
  setInterval(fetchData, POLL_MS);
</script>
</body>
</html>
